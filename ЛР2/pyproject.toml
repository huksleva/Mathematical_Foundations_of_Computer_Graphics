[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lr2-3d-graphics"
version = "1.0.0"
description = "Лабораторная работа 2 по компьютерной графике: глава 3"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.8",
    "jupyter>=1.0",
    "ipykernel>=6.29"
]
